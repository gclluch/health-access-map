<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314545A'/%3E%3Cpath d='M16 7l7 18H9z' fill='%23F7F8FA'/%3E%3C/svg%3E"

  <body>
    <!-- First-paint shell. React's createRoot clears this on mount; without it the page is blank

    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#F7F8FA;font-family:system-ui,sans-serif">
        <div style="color:#5A6472;font-size:13px">Loading ~33,000 ZIP areas…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
